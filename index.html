<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="田町駅 ⇔ LOOP-X 無料シャトルバスの次の発車まで「あと何分」を表示。開けばすぐ次のバスが分かります。平日ダイヤ・上り下り両方向対応。" />
    <meta name="theme-color" content="#2563eb" />
    <title>LOOP-X 次のバスまであと何分｜田町駅 無料シャトル</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong color scheme. Mirrors the keys used by src/ui/theme.ts.
      try {
        var t = localStorage.getItem('loopx-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="表示テーマ"></button>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
